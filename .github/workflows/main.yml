name: Auto Extract and Build TEST MITRA APK

on:
  push:
    branches:
      - main
      - master

  workflow_dispatch:

jobs:
  build:
    name: Build TEST MITRA APK
    runs-on: ubuntu-latest

    steps:

      # ==========================================
      # 1. CHECKOUT
      # ==========================================
      - name: Checkout Repository
        uses: actions/checkout@v4


      # ==========================================
      # 2. JAVA 17
      # ==========================================
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle


      # ==========================================
      # 3. ANDROID SDK
      # ==========================================
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3


      # ==========================================
      # 4. GRADLE 9.3.1
      # ==========================================
      - name: Setup Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"


      # ==========================================
      # 5. FIND ZIP
      # ==========================================
      - name: Find ZIP File
        shell: bash
        run: |
          set -e

          echo "Searching for ZIP file..."

          ZIP_FILE=$(find . \
            -maxdepth 2 \
            -type f \
            -iname "*.zip" \
            | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: No ZIP file found!"
            exit 1
          fi

          echo "ZIP FOUND:"
          echo "$ZIP_FILE"

          echo "ZIP_FILE=$ZIP_FILE" >> "$GITHUB_ENV"


      # ==========================================
      # 6. EXTRACT ZIP
      # ==========================================
      - name: Extract ZIP Automatically
        shell: bash
        run: |
          set -e

          echo "Cleaning old extraction..."

          rm -rf extracted

          mkdir -p extracted

          echo "Extracting:"
          echo "$ZIP_FILE"

          unzip -o "$ZIP_FILE" -d extracted

          echo ""
          echo "ZIP EXTRACTION COMPLETE"


      # ==========================================
      # 7. FIND ANDROID PROJECT
      # ==========================================
      - name: Detect Android Project
        shell: bash
        run: |
          set -e

          PROJECT_DIR=$(find extracted \
            -type f \
            \( \
              -name "settings.gradle.kts" \
              -o \
              -name "settings.gradle" \
            \) \
            -print -quit \
            | xargs -r dirname)

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: Android Gradle project not found!"

            echo "Extracted files:"
            find extracted -maxdepth 4 -type f | head -200

            exit 1
          fi

          echo ""
          echo "ANDROID PROJECT FOUND:"
          echo "$PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"


      # ==========================================
      # 8. CHECK PROJECT
      # ==========================================
      - name: Check Android Project
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          echo "===================================="
          echo "PROJECT DIRECTORY"
          echo "===================================="

          pwd

          echo ""
          echo "PROJECT FILES:"
          ls -la

          echo ""
          echo "Gradle configuration:"
          ls -la *.gradle* 2>/dev/null || true


      # ==========================================
      # 9. CREATE DEBUG KEYSTORE
      # ==========================================
      - name: Create Debug Keystore
        shell: bash
        run: |
          set -e

          KEYSTORE="$PROJECT_DIR/debug.keystore"

          echo "Checking:"
          echo "$KEYSTORE"

          if [ -f "$KEYSTORE" ]; then
            echo "debug.keystore already exists."
          else
            echo "debug.keystore not found."
            echo "Creating new debug.keystore..."

            keytool -genkeypair \
              -v \
              -keystore "$KEYSTORE" \
              -storepass android \
              -keypass android \
              -alias androiddebugkey \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"

            echo "debug.keystore created successfully."
          fi

          echo ""
          echo "Keystore:"
          ls -lh "$KEYSTORE"


      # ==========================================
      # 10. CHECK GRADLE VERSION
      # ==========================================
      - name: Check Gradle Version
        run: |
          gradle --version


      # ==========================================
      # 11. BUILD APK
      # ==========================================
      - name: Build TEST MITRA Debug APK
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          echo "===================================="
          echo "BUILDING TEST MITRA APK"
          echo "===================================="

          gradle clean assembleDebug \
            --no-daemon \
            --stacktrace


      # ==========================================
      # 12. FIND APK
      # ==========================================
      - name: Find Generated APK
        shell: bash
        run: |
          set -e

          echo "===================================="
          echo "SEARCHING FOR APK"
          echo "===================================="

          find "$PROJECT_DIR" \
            -type f \
            -name "*.apk" \
            -print

          APK=$(find "$PROJECT_DIR" \
            -type f \
            -name "*.apk" \
            | grep "/outputs/apk/" \
            | head -n 1)

          if [ -z "$APK" ]; then
            echo ""
            echo "ERROR: APK was NOT generated!"

            echo "Checking build directory:"
            find "$PROJECT_DIR/app/build" \
              -maxdepth 5 \
              -type f \
              2>/dev/null || true

            exit 1
          fi

          echo ""
          echo "APK FOUND:"
          echo "$APK"

          mkdir -p "$GITHUB_WORKSPACE/output"

          cp "$APK" \
            "$GITHUB_WORKSPACE/output/TEST-MITRA.apk"


      # ==========================================
      # 13. UPLOAD APK
      # ==========================================
      - name: Upload TEST MITRA APK
        uses: actions/upload-artifact@v4
        with:
          name: TEST-MITRA-APK
          path: output/TEST-MITRA.apk
          if-no-files-found: error
          retention-days: 7
